version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: swift
  directory: "/Viewer"
  schedule:
    interval: weekly
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: npm
  directory: "/Tools/GitHub-style-generator"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
